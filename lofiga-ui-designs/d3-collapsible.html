<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3: Collapsible Sections</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --purple: #993DF5; --cyan: #3DF5E6; --bg: #191022; --sheet: #1E1828; --sheet-hover: #252030; --text: #fff; --dim: #666; }
        body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; padding-bottom: 160px; }

        /* Header */
        .header-col { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .brand-col { font-size: 1.3rem; font-weight: 700; }
        .brand-col span { color: var(--purple); }
        .header-btns { display: flex; gap: 8px; }
        .icon-btn-col { width: 36px; height: 36px; border-radius: 10px; background: var(--sheet); border: none; color: var(--dim); cursor: pointer; }

        /* Track Row */
        .track-col { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--sheet); border-radius: 14px; margin-bottom: 12px; }
        .art-col { width: 48px; height: 48px; border-radius: 10px; background: linear-gradient(135deg, var(--purple), var(--cyan)); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .info-col { flex: 1; }
        .title-col { font-size: 0.95rem; font-weight: 600; }
        .meta-col { font-size: 0.7rem; color: var(--dim); }

        /* Wave */
        .wave-col { display: flex; align-items: center; justify-content: center; gap: 2px; height: 32px; margin-bottom: 12px; }
        .wave-c { width: 2px; background: var(--purple); border-radius: 1px; }

        /* Bottom Sheet */
        .sheet-col {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--sheet); border-radius: 24px 24px 0 0;
            padding: 16px 18px 24px;
            box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
            max-height: 60vh; overflow-y: auto;
        }
        .handle-col { width: 32px; height: 3px; background: #444; border-radius: 2px; margin: 0 auto 12px; }

        /* Controls Row */
        .ctrl-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .seek-col { flex: 1; height: 4px; background: #333; border-radius: 2px; position: relative; }
        .fill-col { width: 32%; height: 100%; background: linear-gradient(90deg, var(--purple), var(--cyan)); border-radius: 2px; }
        .knob-col { position: absolute; right: -6px; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; background: white; border-radius: 50%; }
        .time-col { font-size: 0.6rem; color: var(--dim); min-width: 30px; }

        /* Play Controls */
        .play-row { display: flex; justify-content: center; align-items: center; gap: 14px; margin-bottom: 16px; }
        .btn-row { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 1.1rem; padding: 6px; }
        .play-row-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--purple); border: none; color: white; font-size: 1.2rem; cursor: pointer; }

        /* Collapsible Cards */
        .collapse-card { background: var(--sheet-hover); border-radius: 14px; margin-bottom: 8px; overflow: hidden; }
        .collapse-header { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .collapse-title { font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .collapse-icon { width: 24px; height: 24px; border-radius: 6px; background: rgba(157,61,245,0.2); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; }
        .collapse-arrow { color: var(--dim); font-size: 0.9rem; transition: transform 0.2s; }
        .collapse-card.open .collapse-arrow { transform: rotate(180deg); }
        .collapse-content { display: none; padding: 0 14px 14px; }
        .collapse-card.open .collapse-content { display: block; }

        /* Effect Rows */
        .effect-row-col { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .effect-name-col { width: 50px; font-size: 0.7rem; color: var(--dim); }
        .effect-track-col { flex: 1; height: 4px; background: #333; border-radius: 2px; }
        .effect-fill-col { width: 60%; height: 100%; background: var(--purple); border-radius: 2px; }
        .effect-val-col { font-size: 0.7rem; font-weight: 600; color: var(--cyan); width: 35px; text-align: right; }

        /* Atmosphere Pills */
        .pills-col { display: flex; gap: 8px; flex-wrap: wrap; }
        .pill-col { padding: 8px 14px; border-radius: 16px; background: var(--bg); border: 1px solid transparent; cursor: pointer; font-size: 0.75rem; color: var(--dim); }
        .pill-col.active { background: rgba(157,61,245,0.2); border-color: var(--purple); color: white; }

        /* Presets */
        .preset-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
        .preset-chip-col { padding: 6px 12px; border-radius: 14px; background: var(--bg); border: none; color: var(--dim); font-size: 0.7rem; cursor: pointer; white-space: nowrap; }
        .preset-chip-col.active { background: var(--purple); color: white; }

        /* Export */
        .export-col { width: 100%; padding: 12px; background: linear-gradient(90deg, var(--purple), var(--cyan)); border: none; border-radius: 12px; color: white; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="header-col">
        <div class="brand-col">Lofiga<span>.</span></div>
        <div class="header-btns"><button class="icon-btn-col">⚙</button><button class="icon-btn-col">☰</button></div>
    </div>

    <div class="track-col"><div class="art-col">🎵</div><div class="info-col"><div class="title-col">Neon Dreams</div><div class="meta-col">Synthwave • 3:42</div></div></div>
    <div class="wave-col" id="wave"></div>

    <div class="sheet-col">
        <div class="handle-col"></div>
        <div class="ctrl-row">
            <span class="time-col">1:18</span>
            <div class="seek-col"><div class="fill-col"></div><div class="knob-col"></div></div>
            <span class="time-col">3:42</span>
        </div>
        <div class="play-row">
            <button class="btn-row">↺</button>
            <button class="btn-row">⏮</button>
            <button class="play-row-btn" id="playBtn">▶</button>
            <button class="btn-row">⏭</button>
            <button class="btn-row">∞</button>
        </div>

        <!-- Presets -->
        <div class="collapse-card open">
            <div class="collapse-header"><span class="collapse-title"><span class="collapse-icon">★</span>Presets</span><span class="collapse-arrow">▼</span></div>
            <div class="collapse-content">
                <div class="preset-scroll">
                    <button class="preset-chip-col active">Slow</button>
                    <button class="preset-chip-col">Chill</button>
                    <button class="preset-chip-col">Dream</button>
                    <button class="preset-chip-col">Night</button>
                    <button class="preset-chip-col">Focus</button>
                </div>
            </div>
        </div>

        <!-- Effects -->
        <div class="collapse-card open">
            <div class="collapse-header"><span class="collapse-title"><span class="collapse-icon">🎛</span>Effects</span><span class="collapse-arrow">▼</span></div>
            <div class="collapse-content">
                <div class="effect-row-col"><span class="effect-name-col">Tempo</span><div class="effect-track-col"><div class="effect-fill-col" style="width:85%"></div></div><span class="effect-val-col">85%</span></div>
                <div class="effect-row-col"><span class="effect-name-col">Pitch</span><div class="effect-track-col"><div class="effect-fill-col" style="width:40%"></div></div><span class="effect-val-col">-2.0</span></div>
                <div class="effect-row-col"><span class="effect-name-col">Reverb</span><div class="effect-track-col"><div class="effect-fill-col" style="width:50%"></div></div><span class="effect-val-col">50%</span></div>
                <div class="effect-row-col"><span class="effect-name-col">Delay</span><div class="effect-track-col"><div class="effect-fill-col" style="width:30%"></div></div><span class="effect-val-col">30%</span></div>
            </div>
        </div>

        <!-- Atmosphere -->
        <div class="collapse-card open">
            <div class="collapse-header"><span class="collapse-title"><span class="collapse-icon">🌫</span>Atmosphere</span><span class="collapse-arrow">▼</span></div>
            <div class="collapse-content">
                <div class="pills-col">
                    <button class="pill-col active">🌧 Rain</button>
                    <button class="pill-col">💿 Vinyl</button>
                    <button class="pill-col">💨 Wind</button>
                    <button class="pill-col">📼 Tape</button>
                </div>
            </div>
        </div>

        <button class="export-col">📥 Export Mix</button>
    </div>

    <script>
        const wave=document.getElementById('wave');
        for(let i=0;i<45;i++){ const b=document.createElement('div'); b.className='wave-c'; b.style.height=(Math.random()*20+8)+'px'; wave.appendChild(b); }
        document.getElementById('playBtn').addEventListener('click',function(){ this.textContent=this.textContent==='▶'?'⏸':'▶'; });
        document.querySelectorAll('.collapse-header').forEach(h=>{ h.addEventListener('click',()=>h.parentElement.classList.toggle('open')); });
        document.querySelectorAll('.preset-chip-col').forEach(p=>{ p.addEventListener('click',()=>{ document.querySelectorAll('.preset-chip-col').forEach(x=>x.classList.remove('active')); p.classList.add('active'); }); });
        document.querySelectorAll('.pill-col').forEach(p=>{ p.addEventListener('click',()=>p.classList.toggle('active')); });
    </script>
</body>
</html>
