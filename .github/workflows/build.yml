name: Build Flutter App

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: flutter pub get

      # Sign with the real upload keystore (same key already registered on
      # Google Play). app/build.gradle.kts reads android/key.properties.
      - name: Decode Keystore & Configure Signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/android/release.keystore"
          cat > "$GITHUB_WORKSPACE/android/key.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/android/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=mykey
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          keytool -list -keystore "$GITHUB_WORKSPACE/android/release.keystore" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | head -8

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Configure Android SDK Versions
        run: python3 scripts/configure_android.py

      - name: Build APK (Signed)
        run: flutter build apk --release

      - name: Build AAB (Signed)
        run: flutter build appbundle --release

      - name: Verify Signing Certificate
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" 2>/dev/null \
            | grep -i "SHA-256" || jarsigner -verify -certs "$APK" | head -10

      - name: Verify 16KB Page-Size Alignment
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ZIPALIGN=$(ls "$ANDROID_HOME"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1)
          "$ZIPALIGN" -c -P 16 4 "$APK" && echo "OK: 16KB-aligned" || { echo "FAIL: not 16KB-aligned"; exit 1; }

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab
