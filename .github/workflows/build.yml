name: Build Flutter App

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build All Platforms
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"

      - name: Initialize Flutter Project
        run: |
          flutter pub get

      - name: Setup Keystore (Android)
        run: |
          keytool -genkeypair -v -keystore release.keystore \
            -alias lofiga -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lofiga2024 -keypass lofiga2024 \
            -dname "CN=Lofiga,O=Lofiga,C=US"

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Check Flutter Setup
        run: flutter doctor -v

      - name: Configure Android Signing & SDK Versions
        working-directory: android/app
        run: |
          python3 -c "
          import os
          import re

          kotlin_dsl = os.path.exists('build.gradle.kts')
          filename = 'build.gradle.kts' if kotlin_dsl else 'build.gradle'

          # Read file
          with open(filename, 'r') as f:
              content = f.read()

          # Update SDK versions (Force compileSdk 34, minSdk 23 for safe Audio/File support)
          if kotlin_dsl:
              content = re.sub(r'compileSdk\s*=\s*flutter.compileSdkVersion', 'compileSdk = 34', content)
              content = re.sub(r'minSdk\s*=\s*flutter.minSdkVersion', 'minSdk = 23', content)
              content = re.sub(r'targetSdk\s*=\s*flutter.targetSdkVersion', 'targetSdk = 34', content)
          else:
              content = re.sub(r'compileSdkVersion\s*flutter.compileSdkVersion', 'compileSdkVersion 34', content)
              content = re.sub(r'minSdkVersion\s*flutter.minSdkVersion', 'minSdkVersion 23', content)
              content = re.sub(r'targetSdkVersion\s*flutter.targetSdkVersion', 'targetSdkVersion 34', content)

          # Append Signing Config
          content_kotlin = '''
          android {
              signingConfigs {
                  create(\"release\") {
                      storeFile = file(\"../../release.keystore\")
                      storePassword = \"lofiga2024\"
                      keyAlias = \"lofiga\"
                      keyPassword = \"lofiga2024\"
                  }
              }
              buildTypes {
                  getByName(\"release\") {
                      signingConfig = signingConfigs.getByName(\"release\")
                  }
              }
          }
          '''

          content_groovy = '''
          android {
              signingConfigs {
                  release {
                      storeFile file('../../release.keystore')
                      storePassword 'lofiga2024'
                      keyAlias 'lofiga'
                      keyPassword 'lofiga2024'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          '''

          content += (content_kotlin if kotlin_dsl else content_groovy)

          # Write back
          with open(filename, 'w') as f:
              f.write(content)
          print(f'Updated SDK versions and appended signing config to {filename}')
          "

      - name: Build APK (Demo Signed)
        run: flutter build apk --release

      - name: Build AAB (Signed)
        run: flutter build appbundle --release

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

      - name: Build iOS (IPA - No CodeSign)
        # Note: 'flutter build ios' requires MacOS.
        # Since we are on ubuntu-latest, we cannot build iOS app directly using xcodebuild.
        # However, we can try to use 'flutter build ios --release --no-codesign' if tools allow,
        # BUT xcodebuild is not available on Linux.
        # FIX: We must use a matrix or separate job for iOS if we want IPA.
        # For this single job on Linux, we can only build Android.
        # I will split the jobs.
        run: echo "Skipping iOS on Linux runner"

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"

      - name: Initialize Flutter Project
        run: |
          flutter pub get

      - name: Update Pod Specs
        working-directory: ios
        run: |
          pod repo update

      - name: Set Dummy Development Team
        run: |
          # Add dummy team ID to project.pbxproj for CI build
          # Use perl because BSD sed (macOS) doesn't handle \n in replacement string correctly
          perl -i -pe 's/PRODUCT_BUNDLE_IDENTIFIER = com.example.lofiga;/PRODUCT_BUNDLE_IDENTIFIER = com.example.lofiga;\n\t\t\t\tDEVELOPMENT_TEAM = XXXXXXXXXX;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Build iOS (No Codesign)
        run: |
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r App.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: App.ipa
