<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D1: Mini Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --purple: #993DF5; --cyan: #3DF5E6; --bg: #191022; --sheet: #1E1828; --sheet-hover: #252030; --text: #fff; --dim: #666; }
        body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 12px; padding-bottom: 140px; }

        /* Header */
        .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .brand { font-size: 1.2rem; font-weight: 700; }
        .brand span { color: var(--purple); }
        .btns { display: flex; gap: 6px; }
        .btn-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--sheet); border: none; color: var(--dim); cursor: pointer; }

        /* Mini Art */
        .mini-art { width: 100%; max-width: 180px; aspect-ratio: 1; margin: 0 auto 12px; border-radius: 16px; background: linear-gradient(145deg, var(--purple), #5b21b6); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; box-shadow: 0 10px 30px rgba(157,61,245,0.3); }

        /* Track */
        .track-mini { text-align: center; margin-bottom: 10px; }
        .track-title { font-size: 1rem; font-weight: 600; }
        .track-art { font-size: 0.75rem; color: var(--dim); }

        /* Wave */
        .wave-mini { display: flex; align-items: center; justify-content: center; gap: 2px; height: 24px; margin-bottom: 10px; }
        .wave-m { width: 2px; background: var(--purple); border-radius: 1px; }

        /* Controls - Fixed Bottom */
        .sheet-mini {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--sheet); border-radius: 20px 20px 0 0;
            padding: 14px 16px 20px;
            box-shadow: 0 -5px 30px rgba(0,0,0,0.4);
        }
        .handle { width: 30px; height: 3px; background: #444; border-radius: 2px; margin: 0 auto 10px; }

        /* Mini Seek */
        .seek-mini { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .time-mini { font-size: 0.6rem; color: var(--dim); min-width: 28px; }
        .bar-mini { flex: 1; height: 4px; background: #333; border-radius: 2px; position: relative; }
        .fill-mini { width: 35%; height: 100%; background: linear-gradient(90deg, var(--purple), var(--cyan)); border-radius: 2px; }
        .knob-mini { position: absolute; right: -5px; top: 50%; transform: translateY(-50%); width: 10px; height: 10px; background: white; border-radius: 50%; }

        /* Play Controls */
        .controls-mini { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 10px; }
        .ctrl-mini { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 1rem; padding: 6px; }
        .ctrl-mini:hover { color: white; }
        .play-mini { width: 40px; height: 40px; border-radius: 50%; background: var(--purple); border: none; color: white; font-size: 1.1rem; cursor: pointer; }

        /* Quick Effects Pills */
        .pills-mini { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
        .pill-mini { padding: 6px 10px; border-radius: 12px; background: var(--sheet-hover); border: none; color: var(--dim); font-size: 0.65rem; cursor: pointer; white-space: nowrap; }
        .pill-mini.active { background: var(--purple); color: white; }

        /* Atmosphere Dots */
        .atmos-mini { display: flex; justify-content: center; gap: 12px; }
        .atmos-dot { width: 32px; height: 32px; border-radius: 50%; background: var(--sheet-hover); border: 2px solid transparent; cursor: pointer; font-size: 0.9rem; }
        .atmos-dot.active { border-color: var(--cyan); background: rgba(61,245,230,0.15); }

        /* Export */
        .export-mini { width: 100%; padding: 10px; background: linear-gradient(90deg, var(--purple), var(--cyan)); border: none; border-radius: 10px; color: white; font-size: 0.8rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="top">
        <div class="brand">Lofiga<span>.</span></div>
        <div class="btns"><button class="btn-icon">⚙</button><button class="btn-icon">☰</button></div>
    </div>

    <div class="mini-art">🎵</div>
    <div class="track-mini"><div class="track-title">Midnight Vibes</div><div class="track-art">LoFi Dreams</div></div>
    <div class="wave-mini" id="wave"></div>

    <div class="sheet-mini">
        <div class="handle"></div>
        <div class="seek-mini">
            <span class="time-mini">1:18</span>
            <div class="bar-mini"><div class="fill-mini"></div><div class="knob-mini"></div></div>
            <span class="time-mini">3:42</span>
        </div>
        <div class="controls-mini">
            <button class="ctrl-mini">↺</button>
            <button class="ctrl-mini">⏮</button>
            <button class="play-mini" id="playBtn">▶</button>
            <button class="ctrl-mini">⏭</button>
            <button class="ctrl-mini">∞</button>
        </div>
        <div class="pills-mini">
            <button class="pill-mini active">Slow</button>
            <button class="pill-mini">Chill</button>
            <button class="pill-mini">Dream</button>
            <button class="pill-mini">Night</button>
            <button class="pill-mini">Focus</button>
        </div>
        <div class="atmos-mini">
            <button class="atmos-dot active">🌧</button>
            <button class="atmos-dot">💿</button>
            <button class="atmos-dot">💨</button>
            <button class="atmos-dot">📼</button>
        </div>
        <button class="export-mini">📥 Export Mix</button>
    </div>

    <script>
        const wave = document.getElementById('wave');
        for(let i=0; i<40; i++){ const b=document.createElement('div'); b.className='wave-m'; b.style.height=(Math.random()*14+6)+'px'; wave.appendChild(b); }
        document.getElementById('playBtn').addEventListener('click',function(){ this.textContent=this.textContent==='▶'?'⏸':'▶'; });
        document.querySelectorAll('.pill-mini').forEach(p=>{ p.addEventListener('click',()=>{ document.querySelectorAll('.pill-mini').forEach(x=>x.classList.remove('active')); p.classList.add('active'); }); });
        document.querySelectorAll('.atmos-dot').forEach(a=>{ a.addEventListener('click',()=>a.classList.toggle('active')); });
    </script>
</body>
</html>
