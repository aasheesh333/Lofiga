name: Build App

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: EAS Build (Android & iOS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm install

      - name: Build Android APK with EAS
        id: build-apk
        run: |
          echo "Starting Android APK build..."
          eas build --platform android --profile preview --non-interactive --no-wait
          echo "✅ Android APK build submitted to EAS"
          echo "📱 Check build status at: https://expo.dev/accounts/$(eas whoami)/projects/lofiga/builds"

      - name: Build Android AAB with EAS
        id: build-aab
        run: |
          echo "Starting Android AAB build..."
          eas build --platform android --profile production --non-interactive --no-wait
          echo "✅ Android AAB build submitted to EAS"

      - name: Build iOS IPA with EAS
        id: build-ios
        run: |
          echo "Starting iOS build..."
          eas build --platform ios --profile preview --non-interactive --no-wait  
          echo "✅ iOS build submitted to EAS"

      - name: Build Summary
        run: |
          echo "## 🎉 Builds Submitted Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All builds have been submitted to Expo EAS Build." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download Your Builds" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Visit: https://expo.dev" >> $GITHUB_STEP_SUMMARY
          echo "2. Sign in with your Expo account" >> $GITHUB_STEP_SUMMARY
          echo "3. Navigate to the 'Lofiga' project" >> $GITHUB_STEP_SUMMARY
          echo "4. Go to 'Builds' tab" >> $GITHUB_STEP_SUMMARY
          echo "5. Download your APK, AAB, and IPA files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⏱️ Build Times" >> $GITHUB_STEP_SUMMARY
          echo "- Android builds: ~10-15 minutes" >> $GITHUB_STEP_SUMMARY
          echo "- iOS builds: ~15-20 minutes" >> $GITHUB_STEP_SUMMARY
