<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lofi Effects Controls</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#993df5",
                        "background-light": "#f7f5f8",
                        "background-dark": "#191022",
                        "surface-dark": "#2a1f36",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "md": "0.375rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .neon-shadow {
                box-shadow: 0 0 10px rgba(153, 61, 245, 0.5), 0 0 20px rgba(153, 61, 245, 0.3);
            }
            .glass-panel {
                @apply bg-white/5 backdrop-blur-md border border-white/10;
            }input[type=range] {
                @apply appearance-none bg-transparent cursor-pointer w-full;
            }
            input[type=range]::-webkit-slider-thumb {
                @apply appearance-none h-4 w-4 rounded-full bg-white shadow-lg border-none -mt-1.5;
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            }
            input[type=range]::-webkit-slider-runnable-track {
                @apply h-1 rounded-full bg-surface-dark;
            }.no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased selection:bg-primary/30">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto shadow-2xl bg-background-dark">
<header class="flex items-center justify-between p-6 pb-2 z-20">
<div class="flex items-center gap-3">
<button class="h-10 w-10 -ml-2 rounded-full flex items-center justify-center text-white/70 hover:bg-white/10 hover:text-white transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h2 class="text-2xl font-bold tracking-tight text-white">Effects</h2>
</div>
<div class="flex items-center gap-3 glass-panel px-3 py-1.5 rounded-full">
<span class="text-xs font-medium text-primary uppercase tracking-wider">Live</span>
<div class="relative inline-flex h-5 w-9 items-center rounded-full bg-primary/20 cursor-pointer">
<div class="h-3 w-3 rounded-full bg-primary shadow-sm ring-1 ring-white/20 translate-x-5 transition-transform"></div>
</div>
</div>
</header>
<div class="px-6 py-4 flex items-end justify-center gap-1 h-16 opacity-60">
<div class="w-1 bg-primary/40 h-4 rounded-full animate-pulse"></div>
<div class="w-1 bg-primary/60 h-8 rounded-full animate-pulse" style="animation-delay: 75ms"></div>
<div class="w-1 bg-primary h-12 rounded-full animate-pulse neon-shadow" style="animation-delay: 150ms"></div>
<div class="w-1 bg-primary/80 h-10 rounded-full animate-pulse" style="animation-delay: 225ms"></div>
<div class="w-1 bg-primary/50 h-6 rounded-full animate-pulse" style="animation-delay: 300ms"></div>
<div class="w-1 bg-primary/30 h-3 rounded-full animate-pulse" style="animation-delay: 375ms"></div>
<div class="w-1 bg-primary/40 h-5 rounded-full animate-pulse" style="animation-delay: 100ms"></div>
<div class="w-1 bg-primary/60 h-9 rounded-full animate-pulse" style="animation-delay: 50ms"></div>
<div class="w-1 bg-primary/80 h-14 rounded-full animate-pulse neon-shadow" style="animation-delay: 200ms"></div>
<div class="w-1 bg-primary/60 h-7 rounded-full animate-pulse" style="animation-delay: 350ms"></div>
<div class="w-1 bg-primary/30 h-4 rounded-full animate-pulse" style="animation-delay: 125ms"></div>
</div>
<main class="flex-1 flex flex-col gap-8 px-6 pb-24">
<section>
<div class="flex items-center justify-between mb-4">
<h3 class="text-sm font-semibold text-white/60 uppercase tracking-widest">Master Decks</h3>
<span class="material-symbols-outlined text-white/40 text-lg">equalizer</span>
</div>
<div class="grid grid-cols-2 gap-6">
<div class="glass-panel p-4 rounded-2xl flex flex-col items-center gap-4 relative overflow-hidden group">
<div class="absolute top-0 inset-x-0 h-16 bg-gradient-to-b from-primary/10 to-transparent pointer-events-none"></div>
<div class="flex-1 w-12 h-48 bg-surface-dark rounded-xl relative flex items-end p-1 shadow-inner border border-white/5">
<div class="w-full bg-primary rounded-lg relative flex justify-center items-start shadow-[0_0_15px_rgba(153,61,245,0.4)]" style="height: 75%;">
<div class="w-full h-8 bg-white rounded-md absolute -top-4 shadow-lg flex items-center justify-center cursor-grab active:cursor-grabbing">
<div class="w-6 h-0.5 bg-gray-300 rounded-full"></div>
</div>
</div>
</div>
<div class="text-center">
<span class="block text-white font-bold text-lg">75%</span>
<span class="text-xs text-white/50 font-medium">Speed</span>
</div>
</div>
<div class="glass-panel p-4 rounded-2xl flex flex-col items-center gap-4 relative overflow-hidden group">
<div class="absolute top-0 inset-x-0 h-16 bg-gradient-to-b from-primary/10 to-transparent pointer-events-none"></div>
<div class="flex-1 w-12 h-48 bg-surface-dark rounded-xl relative flex items-end p-1 shadow-inner border border-white/5">
<div class="w-full bg-primary rounded-lg relative flex justify-center items-start shadow-[0_0_15px_rgba(153,61,245,0.4)]" style="height: 40%;">
<div class="w-full h-8 bg-white rounded-md absolute -top-4 shadow-lg flex items-center justify-center cursor-grab active:cursor-grabbing">
<div class="w-6 h-0.5 bg-gray-300 rounded-full"></div>
</div>
</div>
</div>
<div class="text-center">
<span class="block text-white font-bold text-lg">-2 ST</span>
<span class="text-xs text-white/50 font-medium">Pitch</span>
</div>
</div>
</div>
</section>
<section>
<div class="flex items-center justify-between mb-5">
<h3 class="text-sm font-semibold text-white/60 uppercase tracking-widest">Atmosphere</h3>
<span class="material-symbols-outlined text-white/40 text-lg">tune</span>
</div>
<div class="flex flex-col gap-6">
<div class="group">
<div class="flex justify-between items-center mb-2">
<label class="text-white text-sm font-medium">Space (Reverb)</label>
<span class="text-primary text-xs font-bold bg-primary/10 px-2 py-0.5 rounded">High</span>
</div>
<div class="h-2 w-full bg-surface-dark rounded-full relative">
<div class="absolute h-full bg-primary rounded-full neon-shadow" style="width: 70%"></div>
<div class="absolute h-5 w-5 bg-white rounded-full shadow-lg top-1/2 -translate-y-1/2 cursor-pointer flex items-center justify-center" style="left: 70%">
<div class="w-1.5 h-1.5 bg-primary rounded-full"></div>
</div>
</div>
</div>
<div class="group">
<div class="flex justify-between items-center mb-2">
<label class="text-white text-sm font-medium">Deepness (Bass)</label>
<span class="text-white/60 text-xs font-bold">+6dB</span>
</div>
<div class="h-2 w-full bg-surface-dark rounded-full relative">
<div class="absolute h-full bg-primary/60 rounded-full neon-shadow" style="width: 45%"></div>
<div class="absolute h-5 w-5 bg-white rounded-full shadow-lg top-1/2 -translate-y-1/2 cursor-pointer flex items-center justify-center" style="left: 45%">
<div class="w-1.5 h-1.5 bg-surface-dark rounded-full"></div>
</div>
</div>
</div>
<div class="group">
<div class="flex justify-between items-center mb-2">
<label class="text-white text-sm font-medium">Delay (Echo)</label>
<span class="text-white/60 text-xs font-bold">250ms</span>
</div>
<div class="h-2 w-full bg-surface-dark rounded-full relative">
<div class="absolute h-full bg-primary/60 rounded-full neon-shadow" style="width: 30%"></div>
<div class="absolute h-5 w-5 bg-white rounded-full shadow-lg top-1/2 -translate-y-1/2 cursor-pointer flex items-center justify-center" style="left: 30%">
<div class="w-1.5 h-1.5 bg-surface-dark rounded-full"></div>
</div>
</div>
</div>
</div>
</section>
<section>
<div class="flex items-center justify-between mb-4">
<h3 class="text-sm font-semibold text-white/60 uppercase tracking-widest">Presets</h3>
</div>
<div class="flex gap-3 overflow-x-auto pb-4 no-scrollbar">
<button class="flex-shrink-0 px-5 py-2.5 rounded-xl border border-white/20 text-white/60 hover:text-white hover:border-white/50 hover:bg-white/5 text-sm font-medium transition-all">
<span class="flex items-center gap-2">
<span class="material-symbols-outlined text-lg">block</span>
                            None
                        </span>
</button>
<button class="flex-shrink-0 px-5 py-2.5 rounded-xl bg-primary border border-primary/50 text-white text-sm font-semibold shadow-[0_0_15px_rgba(153,61,245,0.3)] transition-all">
<span class="flex items-center gap-2">
<span class="material-symbols-outlined text-lg">bedtime</span>
                            Chill
                        </span>
</button>
<button class="flex-shrink-0 px-5 py-2.5 rounded-xl glass-panel text-white/80 text-sm font-medium hover:bg-white/10 hover:text-white transition-all">
<span class="flex items-center gap-2">
<span class="material-symbols-outlined text-lg">cloudy_snowing</span>
                            Sad
                        </span>
</button>
<button class="flex-shrink-0 px-5 py-2.5 rounded-xl glass-panel text-white/80 text-sm font-medium hover:bg-white/10 hover:text-white transition-all">
<span class="flex items-center gap-2">
<span class="material-symbols-outlined text-lg">local_taxi</span>
                            Night Drive
                        </span>
</button>
<button class="flex-shrink-0 px-5 py-2.5 rounded-xl glass-panel text-white/80 text-sm font-medium hover:bg-white/10 hover:text-white transition-all">
<span class="flex items-center gap-2">
<span class="material-symbols-outlined text-lg">auto_awesome</span>
                            Dreamy
                        </span>
</button>
<button class="flex-shrink-0 px-5 py-2.5 rounded-xl glass-panel text-white/80 text-sm font-medium hover:bg-white/10 hover:text-white transition-all">
<span class="flex items-center gap-2">
<span class="material-symbols-outlined text-lg">album</span>
                            Vinyl
                        </span>
</button>
</div>
</section>
</main>
<footer class="fixed bottom-0 w-full max-w-md bg-[#191022]/90 backdrop-blur-xl border-t border-white/10 p-4 pb-8 z-50">
<div class="flex items-center gap-4">
<div class="h-12 w-12 rounded-lg bg-surface-dark flex items-center justify-center border border-white/5 relative overflow-hidden">
<div class="absolute inset-0 bg-primary/20 animate-pulse"></div>
<span class="material-symbols-outlined text-primary text-2xl relative z-10">music_note</span>
</div>
<div class="flex-1 overflow-hidden">
<h4 class="text-white font-semibold truncate text-sm">Midnight City Jazz</h4>
<p class="text-white/50 text-xs truncate">Original Mix • 3:45</p>
</div>
<div class="flex items-center gap-3">
<button class="h-10 w-10 rounded-full flex items-center justify-center text-white hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined filled">replay</span>
</button>
<button class="h-12 w-12 rounded-full bg-primary text-white flex items-center justify-center shadow-[0_0_20px_rgba(153,61,245,0.4)] hover:scale-105 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-3xl filled">play_arrow</span>
</button>
</div>
</div>
<div class="mt-4 pt-4 border-t border-white/5 flex justify-between items-center">
<button class="text-xs text-white/40 hover:text-white flex items-center gap-1 transition-colors">
<span class="material-symbols-outlined text-base">folder_open</span>
                    Load File
                </button>
<button class="text-sm text-primary font-bold hover:text-primary/80 flex items-center gap-1 uppercase tracking-wide transition-colors">
                    Export Lofi
                    <span class="material-symbols-outlined text-lg">ios_share</span>
</button>
</div>
</footer>
</div>

</body></html>
