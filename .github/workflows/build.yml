name: Build Flutter App

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build All Platforms
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"

      - name: Initialize Flutter Project
        run: |
          flutter create . --org com.example
          flutter pub get

      - name: Setup Keystore (Android)
        run: |
          keytool -genkeypair -v -keystore release.keystore \
            -alias lofiga -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lofiga2024 -keypass lofiga2024 \
            -dname "CN=Lofiga,O=Lofiga,C=US"

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Check Flutter Setup
        run: flutter doctor -v

      - name: Configure Android Signing & SDK Versions

        run: |
          python3 scripts/configure_android.py

      - name: Build APK (Demo Signed)
        run: flutter build apk --release

      - name: Build AAB (Signed)
        run: flutter build appbundle --release

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

      - name: Build iOS (IPA - No CodeSign)
        # Note: 'flutter build ios' requires MacOS.
        # Since we are on ubuntu-latest, we cannot build iOS app directly using xcodebuild.
        # However, we can try to use 'flutter build ios --release --no-codesign' if tools allow,
        # BUT xcodebuild is not available on Linux.
        # FIX: We must use a matrix or separate job for iOS if we want IPA.
        # For this single job on Linux, we can only build Android.
        # I will split the jobs.
        run: echo "Skipping iOS on Linux runner"

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"

      - name: Initialize Flutter Project
        run: |
          flutter create . --org com.example
          flutter pub get

      - name: Update Pod Specs
        working-directory: ios
        run: |
          pod repo update

      - name: Configure iOS Project for No-CodeSign Build
        run: |
          # Use Python to safely modify project.pbxproj to silence signing errors
          python3 scripts/configure_ios.py

      - name: Build iOS (No Codesign)
        run: |
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r App.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: App.ipa
