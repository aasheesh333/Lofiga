<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design B: Dual Deck</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --purple: #993DF5;
            --cyan: #3DF5E6;
            --bg: #191022;
            --surface: #231B2E;
            --surface-high: #2D243A;
            --text: #FFFFFF;
            --text-dim: #666;
            --text-subtle: rgba(255,255,255,0.4);
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
        }

        /* Main Split Layout */
        .deck {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            height: calc(100vh - 32px);
        }

        /* Left Panel - Visual */
        .panel-visual {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .deck-label {
            font-size: 0.65rem;
            color: var(--text-subtle);
            letter-spacing: 2px;
            margin-bottom: 16px;
        }

        /* Big Waveform */
        .wave-display {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 20px;
            background: var(--bg);
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .wave-bar {
            width: 4px;
            background: linear-gradient(to top, var(--purple), var(--cyan));
            border-radius: 2px;
            transition: height 0.1s;
        }

        .wave-bar.playing {
            animation: waveAnim 0.4s ease-in-out infinite alternate;
        }

        @keyframes waveAnim {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        /* Time Display */
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .time-current { color: var(--cyan); font-weight: 600; }
        .time-total { color: var(--text-subtle); }

        /* Progress Line */
        .progress-line {
            height: 3px;
            background: var(--surface-high);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .progress-fill {
            width: 35%;
            height: 100%;
            background: linear-gradient(90deg, var(--purple), var(--cyan));
            border-radius: 2px;
        }

        /* Track Info Visual */
        .track-visual {
            text-align: center;
            padding: 16px;
            background: var(--bg);
            border-radius: 12px;
        }

        .track-art-big {
            width: 100px;
            height: 100px;
            margin: 0 auto 12px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--purple), var(--cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }

        .track-name { font-size: 1rem; margin-bottom: 4px; }
        .track-artist { font-size: 0.75rem; color: var(--text-subtle); }

        /* Right Panel - Controls */
        .panel-controls {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Transport Controls */
        .transport {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 20px 0;
            border-bottom: 1px solid var(--surface-high);
            margin-bottom: 16px;
        }

        .trans-btn {
            background: var(--surface-high);
            border: none;
            color: var(--text-subtle);
            cursor: pointer;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .trans-btn:hover { color: white; background: var(--purple); }
        .trans-btn.play {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--purple), #7C2FD4);
            color: white;
            font-size: 1.5rem;
        }

        /* Knobs Grid */
        .knobs-section {
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 0.6rem;
            color: var(--text-subtle);
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .knobs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .knob-card {
            background: var(--bg);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .knob-dial {
            width: 56px;
            height: 56px;
            margin: 0 auto 8px;
            border-radius: 50%;
            background: conic-gradient(from 225deg, var(--purple) 0%, var(--cyan) 70%, var(--surface-high) 70%);
            position: relative;
            cursor: pointer;
        }

        .knob-dial::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            background: var(--bg);
            border-radius: 50%;
        }

        .knob-dial::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 12px;
            background: white;
            border-radius: 2px;
            z-index: 1;
        }

        .knob-name { font-size: 0.7rem; color: var(--text-subtle); }
        .knob-val { font-size: 0.8rem; font-weight: 600; color: var(--cyan); margin-top: 4px; }

        /* Presets Row */
        .presets-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .preset-chip {
            padding: 6px 12px;
            border-radius: 16px;
            background: var(--bg);
            border: 1px solid var(--surface-high);
            color: var(--text-subtle);
            font-size: 0.7rem;
            white-space: nowrap;
            cursor: pointer;
        }
        .preset-chip.active {
            background: var(--purple);
            border-color: var(--purple);
            color: white;
        }

        /* Atmosphere Grid */
        .atmos-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .atmos-btn {
            padding: 12px 8px;
            background: var(--bg);
            border: 1px solid transparent;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .atmos-btn.active {
            border-color: var(--cyan);
            background: rgba(61, 245, 230, 0.1);
        }
        .atmos-icon { font-size: 1.2rem; display: block; margin-bottom: 4px; }
        .atmos-label { font-size: 0.6rem; color: var(--text-subtle); }

        /* Export */
        .export-btn {
            margin-top: auto;
            padding: 14px;
            background: linear-gradient(90deg, var(--purple), var(--cyan));
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .deck { grid-template-columns: 1fr; }
            .panel-visual { display: none; }
        }
    </style>
</head>
<body>
    <div class="deck">
        <!-- Left Panel: Visual -->
        <div class="panel-visual">
            <div class="deck-label">◇ VISUALIZER</div>

            <div class="wave-display" id="wave"></div>

            <div class="time-display">
                <span class="time-current" id="currTime">1:24</span>
                <span class="time-total">3:42</span>
            </div>

            <div class="progress-line">
                <div class="progress-fill"></div>
            </div>

            <div class="track-visual">
                <div class="track-art-big">🎵</div>
                <div class="track-name">Neon Nights</div>
                <div class="track-artist">LoFi Dreams</div>
            </div>
        </div>

        <!-- Right Panel: Controls -->
        <div class="panel-controls">
            <div class="deck-label">◇ CONTROLS</div>

            <!-- Transport -->
            <div class="transport">
                <button class="trans-btn">↺</button>
                <button class="trans-btn">⏮</button>
                <button class="trans-btn play" id="playBtn">▶</button>
                <button class="trans-btn">⏭</button>
                <button class="trans-btn">∞</button>
            </div>

            <!-- Presets -->
            <div class="knobs-section">
                <div class="section-title">PRESETS</div>
                <div class="presets-scroll">
                    <div class="preset-chip active">Lofi Slow</div>
                    <div class="preset-chip">Dreamy</div>
                    <div class="preset-chip">Chill</div>
                    <div class="preset-chip">Night</div>
                    <div class="preset-chip">Focus</div>
                </div>
            </div>

            <!-- Knobs -->
            <div class="knobs-section">
                <div class="section-title">EQUALIZER</div>
                <div class="knobs-grid">
                    <div class="knob-card">
                        <div class="knob-dial" style="transform: rotate(45deg)"></div>
                        <div class="knob-name">Tempo</div>
                        <div class="knob-val">85%</div>
                    </div>
                    <div class="knob-card">
                        <div class="knob-dial" style="transform: rotate(-20deg)"></div>
                        <div class="knob-name">Pitch</div>
                        <div class="knob-val">-2.0</div>
                    </div>
                    <div class="knob-card">
                        <div class="knob-dial" style="transform: rotate(60deg)"></div>
                        <div class="knob-name">Reverb</div>
                        <div class="knob-val">50%</div>
                    </div>
                    <div class="knob-card">
                        <div class="knob-dial" style="transform: rotate(30deg)"></div>
                        <div class="knob-name">Delay</div>
                        <div class="knob-val">25%</div>
                    </div>
                </div>
            </div>

            <!-- Atmosphere -->
            <div class="knobs-section">
                <div class="section-title">ATMOSPHERE</div>
                <div class="atmos-grid">
                    <div class="atmos-btn active"><span class="atmos-icon">🌧</span><span class="atmos-label">Rain</span></div>
                    <div class="atmos-btn"><span class="atmos-icon">💿</span><span class="atmos-label">Vinyl</span></div>
                    <div class="atmos-btn"><span class="atmos-icon">💨</span><span class="atmos-label">Wind</span></div>
                    <div class="atmos-btn"><span class="atmos-icon">📼</span><span class="atmos-label">Tape</span></div>
                </div>
            </div>

            <button class="export-btn">⬇ Export Mix</button>
        </div>
    </div>

    <script>
        // Generate waveform
        const wave = document.getElementById('wave');
        for(let i=0; i<50; i++) {
            const bar = document.createElement('div');
            bar.className = 'wave-bar';
            bar.style.height = (Math.random() * 60 + 20) + 'px';
            wave.appendChild(bar);
        }

        // Animate on play
        let playing = false;
        document.getElementById('playBtn').addEventListener('click', function() {
            playing = !playing;
            this.textContent = playing ? '⏸' : '▶';
            document.querySelectorAll('.wave-bar').forEach((bar, i) => {
                if(playing) {
                    bar.style.animation = `waveAnim ${0.3 + Math.random()*0.3}s ease-in-out infinite alternate`;
                    bar.style.animationDelay = i * 0.02 + 's';
                } else {
                    bar.style.animation = 'none';
                }
            });
        });

        // Presets
        document.querySelectorAll('.preset-chip').forEach(c => {
            c.addEventListener('click', () => {
                document.querySelectorAll('.preset-chip').forEach(x => x.classList.remove('active'));
                c.classList.add('active');
            });
        });

        // Atmosphere
        document.querySelectorAll('.atmos-btn').forEach(a => {
            a.addEventListener('click', () => a.classList.toggle('active'));
        });

        // Time update
        let secs = 84;
        setInterval(() => {
            if(playing) {
                secs = (secs + 1) % 222;
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                document.getElementById('currTime').textContent = `${m}:${s.toString().padStart(2,'0')}`;
            }
        }, 1000);
    </script>
</body>
</html>
