<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design C: Floating Cards</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --purple: #993DF5;
            --purple-glow: rgba(157, 61, 245, 0.4);
            --cyan: #3DF5E6;
            --bg: #191022;
            --surface: #231B2E;
            --card: #1E1828;
            --text: #FFFFFF;
            --text-dim: #999;
            --border: rgba(255,255,255,0.08);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(157,61,245,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(61,245,230,0.1) 0%, transparent 50%);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .logo span { color: var(--purple); }

        .menu { display: flex; gap: 12px; }
        .menu-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1.1rem;
        }

        /* Floating Cards Container */
        .cards-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 400px;
            margin: 0 auto;
        }

        /* Card Base */
        .f-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .f-card:hover {
            border-color: rgba(157,61,245,0.3);
            box-shadow: 0 12px 40px rgba(157,61,245,0.15);
        }

        /* Now Playing Card */
        .now-playing {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .album-art {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--purple), var(--cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 8px 24px var(--purple-glow);
        }

        .np-info { flex: 1; }
        .np-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
        .np-artist { font-size: 0.85rem; color: var(--text-dim); }
        .np-status {
            font-size: 0.7rem;
            color: var(--purple);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--purple);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Progress Card */
        .progress-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .wave-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 48px;
        }

        .wave-line {
            width: 3px;
            background: linear-gradient(to top, var(--purple), var(--cyan));
            border-radius: 2px;
        }

        .seek-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .seek-track {
            flex: 1;
            height: 6px;
            background: var(--surface);
            border-radius: 3px;
            position: relative;
            cursor: pointer;
        }

        .seek-progress {
            width: 32%;
            height: 100%;
            background: linear-gradient(90deg, var(--purple), var(--cyan));
            border-radius: 3px;
        }

        .seek-thumb {
            position: absolute;
            right: -7px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .time-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            min-width: 35px;
        }

        /* Controls Card */
        .controls-card {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 16px;
        }

        .ctrl-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--surface);
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
        }
        .ctrl-icon:hover { background: var(--purple-glow); color: white; }

        .play-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--purple);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--purple-glow);
        }

        /* Effects Cards Grid */
        .effects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .effect-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border);
        }

        .effect-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .effect-name {
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .effect-icon-sm {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--purple-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .effect-val {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--cyan);
        }

        .effect-bar {
            height: 6px;
            background: var(--card);
            border-radius: 3px;
            overflow: hidden;
        }

        .effect-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--purple), var(--cyan));
            border-radius: 3px;
        }

        /* Atmosphere Pill Row */
        .atmos-row {
            display: flex;
            gap: 10px;
        }

        .atmos-chip {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 14px 8px;
            background: var(--surface);
            border-radius: 14px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        .atmos-chip:hover { background: var(--card); }
        .atmos-chip.active {
            border-color: var(--purple);
            background: rgba(157,61,245,0.1);
        }
        .atmos-chip span { font-size: 1.3rem; }
        .atmos-chip small { font-size: 0.65rem; color: var(--text-dim); }
        .atmos-chip.active small { color: var(--cyan); }

        /* Full Export Button */
        .export-card {
            background: linear-gradient(135deg, var(--purple), #7C2FD4);
            border: none;
            border-radius: 16px;
            padding: 18px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 30px var(--purple-glow);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">Lofiga<span>.</span></div>
        <div class="menu">
            <button class="menu-btn">⚙</button>
            <button class="menu-btn">☰</button>
        </div>
    </header>

    <!-- Cards Stack -->
    <div class="cards-stack">
        <!-- Now Playing -->
        <div class="f-card now-playing">
            <div class="album-art">🎵</div>
            <div class="np-info">
                <div class="np-title">Starlight Memories</div>
                <div class="np-artist">ChillBeats</div>
                <div class="np-status">
                    <span class="status-dot"></span> Now Playing
                </div>
            </div>
            <button class="ctrl-icon">♡</button>
        </div>

        <!-- Progress -->
        <div class="f-card progress-card">
            <div class="wave-row" id="wave"></div>
            <div class="seek-row">
                <span class="time-label">1:24</span>
                <div class="seek-track">
                    <div class="seek-progress"></div>
                    <div class="seek-thumb"></div>
                </div>
                <span class="time-label">4:12</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="f-card controls-card">
            <button class="ctrl-icon">↺</button>
            <button class="ctrl-icon">⏮</button>
            <button class="play-circle" id="playBtn">▶</button>
            <button class="ctrl-icon">⏭</button>
            <button class="ctrl-icon">∞</button>
        </div>

        <!-- Preset Pills -->
        <div class="f-card" style="padding: 14px 20px;">
            <div class="atmos-row">
                <div class="atmos-chip active"><span>🐢</span><small>Slow</small></div>
                <div class="atmos-chip"><span>⚡</span><small>Fast</small></div>
                <div class="atmos-chip"><span>🌙</span><small>Night</small></div>
                <div class="atmos-chip"><span>💭</span><small>Dream</small></div>
            </div>
        </div>

        <!-- Effects -->
        <div class="effects-grid">
            <div class="effect-card">
                <div class="effect-header">
                    <span class="effect-name"><span class="effect-icon-sm">⚡</span>Tempo</span>
                    <span class="effect-val">85%</span>
                </div>
                <div class="effect-bar"><div class="effect-fill" style="width:85%"></div></div>
            </div>
            <div class="effect-card">
                <div class="effect-header">
                    <span class="effect-name"><span class="effect-icon-sm">🎚</span>Pitch</span>
                    <span class="effect-val">-2.0</span>
                </div>
                <div class="effect-bar"><div class="effect-fill" style="width:40%"></div></div>
            </div>
            <div class="effect-card">
                <div class="effect-header">
                    <span class="effect-name"><span class="effect-icon-sm">🌊</span>Reverb</span>
                    <span class="effect-val">50%</span>
                </div>
                <div class="effect-bar"><div class="effect-fill" style="width:50%"></div></div>
            </div>
            <div class="effect-card">
                <div class="effect-header">
                    <span class="effect-name"><span class="effect-icon-sm">📢</span>Delay</span>
                    <span class="effect-val">30%</span>
                </div>
                <div class="effect-bar"><div class="effect-fill" style="width:30%"></div></div>
            </div>
        </div>

        <!-- Atmosphere -->
        <div class="f-card">
            <div class="atmos-row">
                <div class="atmos-chip active"><span>🌧</span><small>Rain</small></div>
                <div class="atmos-chip"><span>💿</span><small>Vinyl</small></div>
                <div class="atmos-chip"><span>💨</span><small>Wind</small></div>
                <div class="atmos-chip"><span>📼</span><small>Tape</small></div>
            </div>
        </div>

        <!-- Export -->
        <button class="export-card">📥 Export Your Lofi Mix</button>
    </div>

    <script>
        // Wave
        const wave = document.getElementById('wave');
        for(let i=0; i<40; i++) {
            const bar = document.createElement('div');
            bar.className = 'wave-line';
            bar.style.height = (Math.random() * 32 + 12) + 'px';
            wave.appendChild(bar);
        }

        // Play
        let playing = false;
        document.getElementById('playBtn').addEventListener('click', function() {
            playing = !playing;
            this.textContent = playing ? '⏸' : '▶';
        });

        // Chips
        document.querySelectorAll('.atmos-chip').forEach(c => {
            c.addEventListener('click', function() {
                if(this.parentElement.querySelectorAll('.atmos-chip').length === 4) {
                    document.querySelectorAll('.atmos-chip').forEach(x => x.classList.remove('active'));
                    this.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
