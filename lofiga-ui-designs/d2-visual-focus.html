<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D2: Visual Focus</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --purple: #993DF5; --cyan: #3DF5E6; --bg: #191022; --sheet: #1E1828; --sheet-hover: #252030; --text: #fff; --dim: #666; }
        body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; background: radial-gradient(ellipse at 50% 30%, rgba(157,61,245,0.2) 0%, var(--bg) 60%); padding-bottom: 220px; }

        /* Big Hero */
        .hero { padding: 20px; text-align: center; }
        .big-art { width: 200px; height: 200px; margin: 0 auto 20px; border-radius: 24px; background: linear-gradient(145deg, var(--purple), #7c3aed, var(--cyan)); display: flex; align-items: center; justify-content: center; font-size: 4rem; box-shadow: 0 20px 60px rgba(157,61,245,0.4); position: relative; overflow: hidden; }
        .big-art::after { content:''; position:absolute; top:0;left:0;right:0;bottom:0; background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.1) 50%, transparent 60%); }
        .hero-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
        .hero-artist { color: var(--dim); margin-bottom: 16px; }

        /* Wave Large */
        .wave-big { display: flex; align-items: center; justify-content: center; gap: 3px; height: 50px; margin-bottom: 16px; }
        .wave-b { width: 3px; background: linear-gradient(to top, var(--purple), var(--cyan)); border-radius: 2px; }

        /* Bottom Sheet - Full Width */
        .sheet-full {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--sheet); border-radius: 28px 28px 0 0;
            padding: 18px 20px 28px;
            box-shadow: 0 -10px 50px rgba(0,0,0,0.5);
        }
        .handle-full { width: 36px; height: 4px; background: #444; border-radius: 2px; margin: 0 auto 14px; }

        /* Seek */
        .seek-full { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .time-full { font-size: 0.7rem; color: var(--dim); min-width: 35px; }
        .bar-full { flex: 1; height: 5px; background: #333; border-radius: 3px; position: relative; }
        .fill-full { width: 38%; height: 100%; background: linear-gradient(90deg, var(--purple), var(--cyan)); border-radius: 3px; }
        .knob-full { position: absolute; right: -8px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; background: white; border-radius: 50%; }

        /* Controls */
        .controls-full { display: flex; justify-content: center; align-items: center; gap: 18px; margin-bottom: 18px; }
        .ctrl-full { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 1.2rem; padding: 8px; }
        .ctrl-full:hover { color: white; }
        .play-full { width: 56px; height: 56px; border-radius: 50%; background: var(--purple); border: none; color: white; font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 20px rgba(157,61,245,0.4); }

        /* Effects Grid */
        .effects-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
        .effect-card-full {
            background: var(--sheet-hover); border-radius: 14px; padding: 12px;
            display: flex; align-items: center; gap: 10px;
        }
        .effect-ico { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--purple), #7c3aed); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
        .effect-info { flex: 1; }
        .effect-label { font-size: 0.75rem; color: var(--dim); }
        .effect-val { font-size: 0.8rem; font-weight: 700; color: var(--cyan); }

        /* Atmosphere */
        .atmos-full { display: flex; gap: 10px; margin-bottom: 16px; }
        .atmos-full-btn { flex: 1; padding: 10px; background: var(--sheet-hover); border: 2px solid transparent; border-radius: 12px; text-align: center; cursor: pointer; }
        .atmos-full-btn.active { border-color: var(--purple); background: rgba(157,61,245,0.15); }
        .atmos-full-btn span { font-size: 1.2rem; display: block; margin-bottom: 2px; }
        .atmos-full-btn small { font-size: 0.6rem; color: var(--dim); }

        /* Export */
        .export-full { width: 100%; padding: 14px; background: linear-gradient(90deg, var(--purple), var(--cyan)); border: none; border-radius: 14px; color: white; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="hero">
        <div class="big-art">🎵</div>
        <div class="hero-title">Starlight</div>
        <div class="hero-artist">Ambient Dreams</div>
        <div class="wave-big" id="wave"></div>
    </div>

    <div class="sheet-full">
        <div class="handle-full"></div>
        <div class="seek-full">
            <span class="time-full">1:32</span>
            <div class="bar-full"><div class="fill-full"></div><div class="knob-full"></div></div>
            <span class="time-full">4:05</span>
        </div>
        <div class="controls-full">
            <button class="ctrl-full">↺</button>
            <button class="ctrl-full">⏮</button>
            <button class="play-full" id="playBtn">▶</button>
            <button class="ctrl-full">⏭</button>
            <button class="ctrl-full">∞</button>
        </div>
        <div class="effects-grid">
            <div class="effect-card-full"><div class="effect-ico">⚡</div><div class="effect-info"><div class="effect-label">Tempo</div><div class="effect-val">85%</div></div></div>
            <div class="effect-card-full"><div class="effect-ico">🎚</div><div class="effect-info"><div class="effect-label">Pitch</div><div class="effect-val">-2.0</div></div></div>
            <div class="effect-card-full"><div class="effect-ico">🌊</div><div class="effect-info"><div class="effect-label">Reverb</div><div class="effect-val">50%</div></div></div>
            <div class="effect-card-full"><div class="effect-ico">📢</div><div class="effect-info"><div class="effect-label">Delay</div><div class="effect-val">30%</div></div></div>
        </div>
        <div class="atmos-full">
            <div class="atmos-full-btn active"><span>🌧</span><small>Rain</small></div>
            <div class="atmos-full-btn"><span>💿</span><small>Vinyl</small></div>
            <div class="atmos-full-btn"><span>💨</span><small>Wind</small></div>
            <div class="atmos-full-btn"><span>📼</span><small>Tape</small></div>
        </div>
        <button class="export-full">📥 Export Mix</button>
    </div>

    <script>
        const wave=document.getElementById('wave');
        for(let i=0;i<50;i++){ const b=document.createElement('div'); b.className='wave-b'; b.style.height=(Math.random()*35+12)+'px'; wave.appendChild(b); }
        document.getElementById('playBtn').addEventListener('click',function(){ this.textContent=this.textContent==='▶'?'⏸':'▶'; });
        document.querySelectorAll('.atmos-full-btn').forEach(a=>{ a.addEventListener('click',()=>a.classList.toggle('active')); });
    </script>
</body>
</html>
