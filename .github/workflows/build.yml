name: Build App

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias lofiga-release -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Lofiga, OU=Engineering, O=Bolt, L=SanFrancisco, S=CA, C=US"
          mkdir -p android/app
          mv release.keystore android/app/release.keystore

      - name: Configure Gradle Signing
        run: |
          echo "android.injected.signing.store.file=release.keystore" >> android/gradle.properties
          echo "android.injected.signing.store.password=password123" >> android/gradle.properties
          echo "android.injected.signing.key.alias=lofiga-release" >> android/gradle.properties
          echo "android.injected.signing.key.password=password123" >> android/gradle.properties

      - name: Build Android (APK & AAB)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            --max-workers=2 \
            --no-daemon \
            --parallel \
            --stacktrace \
            -x lint \
            -x lintVitalRelease \
            -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lofiga-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: lofiga-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

  ios:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm install

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update

      - name: Build IPA (Unsigned)
        env:
          RCT_NO_LAUNCH_PACKAGER: 1
          CI: 1
        run: |
          cd ios
          xcodebuild -workspace Lofiga.xcworkspace \
            -scheme Lofiga \
            -configuration Release \
            -sdk iphoneos \
            -archivePath Lofiga.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

          # Create Payload directory and copy the .app
          mkdir -p Payload
          cp -r Lofiga.xcarchive/Products/Applications/Lofiga.app Payload/

          # Zip it into an IPA
          zip -rk Lofiga.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lofiga-release-ipa
          path: ios/Lofiga.ipa
