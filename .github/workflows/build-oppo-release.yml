name: Build OPPO Release APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build signed universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /home/runner/work/release.keystore
          ls -la /home/runner/work/release.keystore

      - name: Build AAB (release signed)
        env:
          KEYSTORE_PATH: /home/runner/work/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: mykey
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Write key.properties for gradle
          cat > android/key.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod +x android/gradlew
          flutter build appbundle --release

      - name: Build universal APK with bundletool
        run: |
          curl -sL -o bundletool.jar "https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar"
          java -jar bundletool.jar build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output=/tmp/lofiga.apks \
            --mode=universal \
            --ks=/home/runner/work/release.keystore \
            --ks-key-alias=mykey \
            --ks-pass=pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass=pass:${{ secrets.KEY_PASSWORD }}
          unzip -o /tmp/lofiga.apks -d /tmp/apks_out
          mv /tmp/apks_out/universal.apk lofiga-universal.apk
          ls -la lofiga-universal.apk

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: lofiga-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: lofiga-universal-apk
          path: lofiga-universal.apk
