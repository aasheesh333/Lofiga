name: Build App

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Setup Keystore
        working-directory: android/app
        run: |
          keytool -genkeypair -v -keystore release.keystore \
            -alias lofiga -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lofiga2024 -keypass lofiga2024 \
            -dname "CN=Lofiga,O=Lofiga,C=US"

      - name: Create gradle.properties
        working-directory: android
        run: |
          cat >> gradle.properties << 'EOF'
          MYAPP_RELEASE_STORE_FILE=release.keystore
          MYAPP_RELEASE_KEY_ALIAS=lofiga
          MYAPP_RELEASE_STORE_PASSWORD=lofiga2024
          MYAPP_RELEASE_KEY_PASSWORD=lofiga2024
          org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.parallel=true
          org.gradle.configureondemand=true
          org.gradle.daemon=false
          EOF

      - name: Build APK & AAB
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease \
            --no-daemon \
            --max-workers 2 \
            --build-cache \
            -x lint -x lintVitalAnalyzeRelease -x lintVitalReportRelease \
            -x lintRelease -x lintVitalRelease \
            --stacktrace --info | tee build.log || (tail -100 build.log && exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
