name: Build Android Release

on:
  push:
    branches:
      - "main"
      - "master"
      - "native-android-rewrite"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-release:
    name: Build Android Release (AAB + APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
      ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
      ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
      PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
      VERSION_CODE: ${{ secrets.VERSION_CODE }}
      VERSION_NAME: ${{ secrets.VERSION_NAME }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: "mykey"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $HOME/release.keystore
          echo "KEYSTORE_PATH=$HOME/release.keystore" >> $GITHUB_ENV

      - name: Make Gradlew Executable
        run: |
          chmod +x Lofiga/native-android/gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > Lofiga/native-android/local.properties

      - name: Build Release AAB
        run: |
          cd Lofiga/native-android
          ./gradlew :app:bundleRelease \
            -PKEYSTORE_PATH="$KEYSTORE_PATH" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD" \
            -PONESIGNAL_APP_ID="$ONESIGNAL_APP_ID"

      - name: Build Release APK
        run: |
          cd Lofiga/native-android
          ./gradlew :app:assembleRelease \
            -PKEYSTORE_PATH="$KEYSTORE_PATH" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD" \
            -PONESIGNAL_APP_ID="$ONESIGNAL_APP_ID"

      - name: Run Lint
        run: |
          cd Lofiga/native-android
          set +e
          ./gradlew :app:lintRelease \
            -PONESIGNAL_APP_ID="$ONESIGNAL_APP_ID"
          LINT_EXIT=$?
          echo "=== Full lint report ==="
          cat app/build/reports/lint-results-release.txt 2>/dev/null || true
          exit $LINT_EXIT

      - name: Verify APK Signature
        run: |
          echo "=== Keystore Certificate ==="
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1 | head -20
          echo "=== APK Signing Certificate ==="
          APK=${{ github.workspace }}/Lofiga/native-android/app/build/outputs/apk/release/app-release.apk
          AAB=${{ github.workspace }}/Lofiga/native-android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -certs "$AAB" 2>&1 | head -10
          echo "=== Build artifacts exist ==="
          ls -lh "$APK" "$AAB"

      - name: Verify 16KB Page-Size Alignment
        run: |
          APK=${{ github.workspace }}/Lofiga/native-android/app/build/outputs/apk/release/app-release.apk
          ZIPALIGN=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1)
          echo "=== 16KB alignment check (Android 15+ page-size requirement) ==="
          "$ZIPALIGN" -c -P 16 4 "$APK" && echo "OK: native libs are 16KB-aligned" || { echo "FAIL: native libs not aligned to 16KB"; exit 1; }

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: Lofiga/native-android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: Lofiga/native-android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Lofiga/native-android/app/build/outputs/bundle/release/app-release.aab
            Lofiga/native-android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
