<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D4: Horizontal Stack</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --purple: #993DF5; --cyan: #3DF5E6; --bg: #191022; --sheet: #1E1828; --sheet-hover: #252030; --text: #fff; --dim: #666; }
        body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 200px; }

        /* Header */
        .top-hor { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 0 4px; }
        .brand-hor { font-size: 1.3rem; font-weight: 700; }
        .brand-hor span { color: var(--purple); }
        .menu-hor { display: flex; gap: 8px; }
        .btn-hor { width: 34px; height: 34px; border-radius: 10px; background: var(--sheet); border: none; color: var(--dim); cursor: pointer; }

        /* Art & Track */
        .hero-hor { text-align: center; margin-bottom: 14px; }
        .art-hor { width: 140px; height: 140px; margin: 0 auto 12px; border-radius: 20px; background: linear-gradient(145deg, var(--purple), var(--cyan)); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; box-shadow: 0 15px 40px rgba(157,61,245,0.35); }
        .title-hor { font-size: 1.2rem; font-weight: 600; }
        .artist-hor { font-size: 0.8rem; color: var(--dim); }

        /* Wave */
        .wave-hor { display: flex; align-items: center; justify-content: center; gap: 2px; height: 28px; margin-bottom: 12px; }
        .wave-h { width: 2px; background: var(--purple); border-radius: 1px; }

        /* Horizontal Scrollable Effects Panel */
        .effects-scroll {
            display: flex; gap: 10px; overflow-x: auto; padding: 4px;
            scrollbar-width: none; margin-bottom: 12px;
        }
        .effects-scroll::-webkit-scrollbar { display: none; }

        .effect-card-hor {
            flex-shrink: 0; width: 100px; background: var(--sheet); border-radius: 14px;
            padding: 12px; text-align: center; border: 1px solid transparent;
        }
        .effect-card-hor.active { border-color: var(--purple); background: rgba(157,61,245,0.15); }
        .effect-icon-hor { width: 36px; height: 36px; margin: 0 auto 8px; border-radius: 10px; background: linear-gradient(135deg, var(--purple), #7c3aed); display: flex; align-items: center; justify-content: center; font-size: 1rem; }
        .effect-name-hor { font-size: 0.7rem; color: var(--dim); margin-bottom: 4px; }
        .effect-val-hor { font-size: 0.8rem; font-weight: 700; color: var(--cyan); }

        /* Preset Pills */
        .presets-hor { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .presets-hor::-webkit-scrollbar { display: none; }
        .preset-hor { padding: 6px 14px; border-radius: 16px; background: var(--sheet); border: none; color: var(--dim); font-size: 0.75rem; cursor: pointer; white-space: nowrap; }
        .preset-hor.active { background: var(--purple); color: white; }

        /* Bottom Sheet - Fixed */
        .sheet-hor {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--sheet); border-radius: 24px 24px 0 0;
            padding: 16px 18px 24px;
            box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
        }
        .handle-hor { width: 32px; height: 3px; background: #444; border-radius: 2px; margin: 0 auto 12px; }

        /* Seek */
        .seek-hor { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .time-hor { font-size: 0.6rem; color: var(--dim); min-width: 28px; }
        .bar-hor { flex: 1; height: 4px; background: #333; border-radius: 2px; position: relative; }
        .fill-hor { width: 35%; height: 100%; background: linear-gradient(90deg, var(--purple), var(--cyan)); border-radius: 2px; }
        .knob-hor { position: absolute; right: -6px; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; background: white; border-radius: 50%; }

        /* Controls */
        .controls-hor { display: flex; justify-content: center; align-items: center; gap: 14px; margin-bottom: 14px; }
        .ctrl-hor { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 1rem; padding: 6px; }
        .ctrl-hor:hover { color: white; }
        .play-hor { width: 48px; height: 48px; border-radius: 50%; background: var(--purple); border: none; color: white; font-size: 1.2rem; cursor: pointer; }

        /* Atmosphere Row */
        .atmos-hor { display: flex; gap: 8px; margin-bottom: 14px; }
        .atmos-hor-btn { flex: 1; padding: 10px 6px; background: var(--sheet-hover); border: 2px solid transparent; border-radius: 12px; text-align: center; cursor: pointer; }
        .atmos-hor-btn.active { border-color: var(--cyan); background: rgba(61,245,230,0.15); }
        .atmos-hor-btn span { font-size: 1.1rem; display: block; margin-bottom: 2px; }
        .atmos-hor-btn small { font-size: 0.55rem; color: var(--dim); }

        /* Export */
        .export-hor { width: 100%; padding: 12px; background: linear-gradient(90deg, var(--purple), var(--cyan)); border: none; border-radius: 12px; color: white; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="top-hor">
        <div class="brand-hor">Lofiga<span>.</span></div>
        <div class="menu-hor"><button class="btn-hor">⚙</button><button class="btn-hor">☰</button></div>
    </div>

    <div class="hero-hor">
        <div class="art-hor">🎵</div>
        <div class="title-hor">Cosmic Vibes</div>
        <div class="artist-hor">Ambient Collection</div>
    </div>
    <div class="wave-hor" id="wave"></div>

    <!-- Horizontal Scrollable Effects -->
    <div class="effects-scroll">
        <div class="effect-card-hor active"><div class="effect-icon-hor">⚡</div><div class="effect-name-hor">Tempo</div><div class="effect-val-hor">85%</div></div>
        <div class="effect-card-hor"><div class="effect-icon-hor">🎚</div><div class="effect-name-hor">Pitch</div><div class="effect-val-hor">-2.0</div></div>
        <div class="effect-card-hor"><div class="effect-icon-hor">🌊</div><div class="effect-name-hor">Reverb</div><div class="effect-val-hor">50%</div></div>
        <div class="effect-card-hor"><div class="effect-icon-hor">📢</div><div class="effect-name-hor">Delay</div><div class="effect-val-hor">30%</div></div>
        <div class="effect-card-hor"><div class="effect-icon-hor">🔊</div><div class="effect-name-hor">Bass</div><div class="effect-val-hor">40%</div></div>
        <div class="effect-card-hor"><div class="effect-icon-hor">🎸</div><div class="effect-name-hor">Treble</div><div class="effect-val-hor">20%</div></div>
    </div>

    <!-- Presets -->
    <div class="presets-hor">
        <button class="preset-hor active">Lofi</button>
        <button class="preset-hor">Slow</button>
        <button class="preset-hor">Dream</button>
        <button class="preset-hor">Chill</button>
        <button class="preset-hor">Night</button>
        <button class="preset-hor">Focus</button>
        <button class="preset-hor">Custom</button>
    </div>

    <!-- Bottom Sheet -->
    <div class="sheet-hor">
        <div class="handle-hor"></div>
        <div class="seek-hor">
            <span class="time-hor">1:24</span>
            <div class="bar-hor"><div class="fill-hor"></div><div class="knob-hor"></div></div>
            <span class="time-hor">4:08</span>
        </div>
        <div class="controls-hor">
            <button class="ctrl-hor">↺</button>
            <button class="ctrl-hor">⏮</button>
            <button class="play-hor" id="playBtn">▶</button>
            <button class="ctrl-hor">⏭</button>
            <button class="ctrl-hor">∞</button>
        </div>
        <div class="atmos-hor">
            <div class="atmos-hor-btn active"><span>🌧</span><small>Rain</small></div>
            <div class="atmos-hor-btn"><span>💿</span><small>Vinyl</small></div>
            <div class="atmos-hor-btn"><span>💨</span><small>Wind</small></div>
            <div class="atmos-hor-btn"><span>📼</span><small>Tape</small></div>
        </div>
        <button class="export-hor">📥 Export Mix</button>
    </div>

    <script>
        const wave=document.getElementById('wave');
        for(let i=0;i<35;i++){ const b=document.createElement('div'); b.className='wave-h'; b.style.height=(Math.random()*16+6)+'px'; wave.appendChild(b); }
        document.getElementById('playBtn').addEventListener('click',function(){ this.textContent=this.textContent==='▶'?'⏸':'▶'; });
        document.querySelectorAll('.effect-card-hor').forEach(c=>{ c.addEventListener('click',()=>c.classList.toggle('active')); });
        document.querySelectorAll('.preset-hor').forEach(p=>{ p.addEventListener('click',()=>{ document.querySelectorAll('.preset-hor').forEach(x=>x.classList.remove('active')); p.classList.add('active'); }); });
        document.querySelectorAll('.atmos-hor-btn').forEach(a=>{ a.addEventListener('click',()=>a.classList.toggle('active')); });
    </script>
</body>
</html>
