name: Build App

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias lofiga-release -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Lofiga, OU=Engineering, O=Bolt, L=SanFrancisco, S=CA, C=US"
          mv release.keystore android/app/

      - name: Configure Android Signing
        run: |
          if [ -f "android/app/build.gradle" ]; then
            echo "Appending to build.gradle"
            cat <<EOF >> android/app/build.gradle
          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'password123'
                      keyAlias 'lofiga-release'
                      keyPassword 'password123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          elif [ -f "android/app/build.gradle.kts" ]; then
            echo "Appending to build.gradle.kts"
            cat <<EOF >> android/app/build.gradle.kts
          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("release.keystore")
                      storePassword = "password123"
                      keyAlias = "lofiga-release"
                      keyPassword = "password123"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF
          fi

      - name: Build Android (APK & AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lofiga-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: lofiga-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

  ios:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Cache Pods
        uses: actions/cache@v3
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update

      - name: Build IPA (Unsigned)
        env:
          RCT_NO_LAUNCH_PACKAGER: 1
          CI: 1
        run: |
          cd ios
          xcodebuild -workspace Lofiga.xcworkspace \
            -scheme Lofiga \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            build

          # Create Payload directory and copy the .app
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Lofiga.app Payload/

          # Zip it into an IPA
          zip -rk Lofiga.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lofiga-release-ipa
          path: ios/Lofiga.ipa
