<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lofiga - Settings</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#993df5",
              "background-light": "#f7f5f8",
              "background-dark": "#191022", // Deep navy/purple tone
              "surface-dark": "#231b2e", // Slightly lighter for cards
            },
            fontFamily: {
              "display": ["Spline Sans", "sans-serif"],
              "body": ["Noto Sans", "sans-serif"],
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
            boxShadow: {
                "neon": "0 0 20px rgba(153, 61, 245, 0.4)",
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display antialiased text-slate-900 dark:text-gray-100 bg-background-light dark:bg-background-dark selection:bg-primary selection:text-white">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden pb-10">
<!-- Header -->
<header class="sticky top-0 z-50 flex items-center justify-between px-4 pt-12 pb-4 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<button class="flex h-10 w-10 items-center justify-center rounded-full transition-colors hover:bg-black/5 dark:hover:bg-white/10 active:scale-95 text-slate-900 dark:text-white">
<span class="material-symbols-outlined text-[20px]">arrow_back_ios_new</span>
</button>
<h1 class="text-lg font-bold tracking-tight text-center flex-1 pr-10">Settings</h1>
</header>
<!-- Main Content -->
<main class="flex-1 px-5 pt-4">
<!-- List Container -->
<div class="overflow-hidden rounded-2xl bg-white dark:bg-white/5 border border-slate-200 dark:border-white/5 shadow-sm">
<!-- App Info -->
<button class="group flex w-full items-center justify-between p-4 transition-colors hover:bg-slate-50 dark:hover:bg-white/5 active:bg-slate-100 dark:active:bg-white/10">
<div class="flex items-center gap-4">
<div class="flex h-9 w-9 items-center justify-center rounded-lg bg-blue-100 dark:bg-blue-500/20 text-blue-600 dark:text-blue-300">
<span class="material-symbols-outlined text-[20px]">info</span>
</div>
<span class="text-base font-medium text-slate-800 dark:text-gray-200">App Info</span>
</div>
<span class="material-symbols-outlined text-slate-400 dark:text-primary transition-transform group-hover:translate-x-0.5 text-[20px]">chevron_right</span>
</button>
<!-- Separator -->
<div class="h-px w-full bg-slate-100 dark:bg-white/5 pl-[4.5rem]"></div>
<!-- Privacy Policy -->
<button class="group flex w-full items-center justify-between p-4 transition-colors hover:bg-slate-50 dark:hover:bg-white/5 active:bg-slate-100 dark:active:bg-white/10">
<div class="flex items-center gap-4">
<div class="flex h-9 w-9 items-center justify-center rounded-lg bg-purple-100 dark:bg-purple-500/20 text-purple-600 dark:text-purple-300">
<span class="material-symbols-outlined text-[20px]">policy</span>
</div>
<span class="text-base font-medium text-slate-800 dark:text-gray-200">Privacy Policy</span>
</div>
<span class="material-symbols-outlined text-slate-400 dark:text-primary transition-transform group-hover:translate-x-0.5 text-[20px]">chevron_right</span>
</button>
<!-- Separator -->
<div class="h-px w-full bg-slate-100 dark:bg-white/5 pl-[4.5rem]"></div>
<!-- Disclaimer -->
<button class="group flex w-full items-center justify-between p-4 transition-colors hover:bg-slate-50 dark:hover:bg-white/5 active:bg-slate-100 dark:active:bg-white/10">
<div class="flex items-center gap-4">
<div class="flex h-9 w-9 items-center justify-center rounded-lg bg-orange-100 dark:bg-orange-500/20 text-orange-600 dark:text-orange-300">
<span class="material-symbols-outlined text-[20px]">warning</span>
</div>
<span class="text-base font-medium text-slate-800 dark:text-gray-200">Disclaimer</span>
</div>
<span class="material-symbols-outlined text-slate-400 dark:text-primary transition-transform group-hover:translate-x-0.5 text-[20px]">chevron_right</span>
</button>
<!-- Separator -->
<div class="h-px w-full bg-slate-100 dark:bg-white/5 pl-[4.5rem]"></div>
<!-- Support -->
<button class="group flex w-full items-center justify-between p-4 transition-colors hover:bg-slate-50 dark:hover:bg-white/5 active:bg-slate-100 dark:active:bg-white/10">
<div class="flex items-center gap-4">
<div class="flex h-9 w-9 items-center justify-center rounded-lg bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-300">
<span class="material-symbols-outlined text-[20px]">support_agent</span>
</div>
<span class="text-base font-medium text-slate-800 dark:text-gray-200">Support</span>
</div>
<span class="material-symbols-outlined text-slate-400 dark:text-primary transition-transform group-hover:translate-x-0.5 text-[20px]">chevron_right</span>
</button>
</div>
<!-- Illustration / Decoration Area (Optional Lofi Vibe) -->
<div class="mt-10 flex flex-col items-center justify-center opacity-80">
<div class="relative h-32 w-full overflow-hidden rounded-2xl">
<!-- Abstract gradient background representing sound waves -->
<div class="absolute inset-0 bg-gradient-to-r from-primary/20 via-purple-900/40 to-primary/20" data-alt="Abstract purple gradient lofi sound wave visualization"></div>
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-6xl text-white/20">graphic_eq</span>
</div>
</div>
<p class="mt-4 text-center text-sm text-slate-500 dark:text-slate-400 max-w-[280px]">
                    Transforming your local library into chill beats, entirely offline.
                </p>
</div>
</main>
<!-- Footer Actions -->
<footer class="mt-auto px-5 pt-8 pb-6">
<button class="relative w-full overflow-hidden rounded-xl bg-primary py-4 text-center font-bold text-white shadow-neon transition-all hover:scale-[1.02] active:scale-[0.98]">
<div class="absolute inset-0 bg-gradient-to-r from-white/0 via-white/10 to-white/0 opacity-0 hover:opacity-100 transition-opacity duration-500"></div>
<span class="flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">star</span>
                    Rate Lofiga
                </span>
</button>
<div class="mt-6 flex flex-col items-center gap-1">
<p class="text-xs font-medium text-slate-400 dark:text-white/30 tracking-wide">
                    VERSION 1.0 (BUILD 42)
                </p>
<p class="text-[10px] text-slate-300 dark:text-white/20">
                    Made with 💜 for Music
                </p>
</div>
</footer>
</div>
