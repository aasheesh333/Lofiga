<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Export and Save Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#993df5",
                        "background-light": "#f7f5f8",
                        "background-dark": "#191022",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        /* Custom Scrollbar for hidden overflow feel */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .neon-shadow {
            box-shadow: 0 0 20px rgba(153, 61, 245, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-white antialiased selection:bg-primary selection:text-white">
<div class="relative flex min-h-screen w-full flex-col overflow-hidden max-w-md mx-auto shadow-2xl bg-background-light dark:bg-background-dark">
<!-- Header -->
<header class="flex items-center justify-between px-6 pt-12 pb-4 z-10">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-white/10 active:bg-white/20 transition-colors text-slate-900 dark:text-white">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="text-xl font-bold tracking-tight">Export Settings</h1>
<div class="size-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col px-6 gap-8 overflow-y-auto pb-32">
<!-- Preview Card -->
<div class="relative w-full aspect-square sm:aspect-video rounded-2xl overflow-hidden shadow-lg group">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Abstract gradient geometric shapes representing lofi music visualization" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBXz55gPK3Ofoeeu9qJ_ohCSViRpuZnmWPq96bT-doXtLE-2kleLLfR2DxsyBQ2Lra5eoY-wnIoYK4bqKO8OBfH8fGk6iWlDUlFEt4UfVL6kkkVv3aA_xSmgxcLD356wVzgDyNFr154DDMkzQZUtRYResFUCNiH159vspF1PQtC8mGyUNisxVoTtoyXSRze78M0y53O3eVDp5uErKGtLRJF72sLYdiXoAY6fwfWjI8EoJUFvqrBG_Yzp-SINZ9ZEKJchxXoD_wd2-U');"></div>
<div class="absolute inset-0 bg-gradient-to-t from-background-dark/90 via-background-dark/20 to-transparent"></div>
<!-- Success Badge (Mock State) -->
<div class="absolute top-4 right-4 bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1 shadow-[0_0_10px_rgba(34,211,238,0.2)] backdrop-blur-md">
<span class="material-symbols-outlined text-sm">check_circle</span>
                    Saved
                </div>
<div class="absolute bottom-0 left-0 w-full p-6">
<h2 class="text-2xl font-bold leading-tight mb-1">Night City Rain</h2>
<div class="flex items-center gap-2 text-white/60 text-sm">
<span class="material-symbols-outlined text-sm">schedule</span>
<span>03:42</span>
<span>•</span>
<span class="material-symbols-outlined text-sm">graphic_eq</span>
<span>Lofi Mix</span>
</div>
</div>
</div>
<!-- Settings Form -->
<div class="flex flex-col gap-6">
<!-- Track Name Input -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-white/70 ml-1">Track Name</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-white/40 group-focus-within:text-primary transition-colors">edit</span>
</div>
<input class="w-full h-14 pl-12 pr-4 bg-white/5 border border-white/10 rounded-xl text-white placeholder:text-white/20 focus:border-primary/50 focus:ring-1 focus:ring-primary/50 focus:bg-white/10 transition-all outline-none" placeholder="My Lofi Remix" type="text" value="Night City Rain"/>
</div>
</div>
<!-- Format Selection -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-white/70 ml-1">File Format</label>
<div class="flex gap-4">
<label class="flex-1 cursor-pointer">
<input checked="" class="peer sr-only" name="format" type="radio"/>
<div class="h-12 flex items-center justify-center rounded-xl bg-white/5 border border-white/10 text-white/60 peer-checked:bg-white/10 peer-checked:border-primary/50 peer-checked:text-white transition-all peer-checked:shadow-[0_0_10px_rgba(153,61,245,0.1)]">
<span class="font-medium">MP3</span>
</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="format" type="radio"/>
<div class="h-12 flex items-center justify-center rounded-xl bg-white/5 border border-white/10 text-white/60 peer-checked:bg-white/10 peer-checked:border-primary/50 peer-checked:text-white transition-all peer-checked:shadow-[0_0_10px_rgba(153,61,245,0.1)]">
<span class="font-medium">WAV</span>
</div>
</label>
</div>
</div>
<!-- Quality Selector -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-white/70 ml-1">Audio Quality</label>
<div class="glass-panel p-1 rounded-xl flex items-center relative">
<!-- 128kbps -->
<label class="flex-1 cursor-pointer relative z-10">
<input class="peer sr-only" name="quality" type="radio"/>
<div class="h-10 flex flex-col items-center justify-center rounded-lg text-sm text-white/50 font-medium peer-checked:text-white transition-colors">
<span>Low</span>
<span class="text-[10px] opacity-60">128k</span>
</div>
<!-- Active Background Indicator (Only shows when checked) -->
<div class="absolute inset-0 bg-primary/20 rounded-lg opacity-0 peer-checked:opacity-100 transition-opacity -z-10"></div>
</label>
<!-- 256kbps -->
<label class="flex-1 cursor-pointer relative z-10">
<input checked="" class="peer sr-only" name="quality" type="radio"/>
<div class="h-10 flex flex-col items-center justify-center rounded-lg text-sm text-white/50 font-medium peer-checked:text-white transition-colors">
<span>Medium</span>
<span class="text-[10px] opacity-60">256k</span>
</div>
<!-- Active Indicator Simulated via Background Utility on Parent in React usually, here using per-item background for simplicity in pure HTML/CSS -->
<div class="absolute inset-0 bg-primary rounded-lg shadow-lg opacity-0 peer-checked:opacity-100 transition-opacity -z-10"></div>
</label>
<!-- Lossless -->
<label class="flex-1 cursor-pointer relative z-10">
<input class="peer sr-only" name="quality" type="radio"/>
<div class="h-10 flex flex-col items-center justify-center rounded-lg text-sm text-white/50 font-medium peer-checked:text-white transition-colors">
<span>High</span>
<span class="text-[10px] opacity-60">WAV</span>
</div>
<div class="absolute inset-0 bg-primary/20 rounded-lg opacity-0 peer-checked:opacity-100 transition-opacity -z-10"></div>
</label>
</div>
</div>
</div>
</main>
<!-- Bottom Actions -->
<div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background-dark via-background-dark to-transparent z-20 max-w-md mx-auto">
<button class="w-full h-14 rounded-xl bg-gradient-to-r from-primary to-purple-600 text-white font-bold text-lg neon-shadow hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mb-4 group">
<span>Save to Device</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">download</span>
</button>
<button class="w-full h-12 rounded-xl border border-white/10 text-white/80 font-medium hover:bg-white/5 active:bg-white/10 transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-lg">ios_share</span>
<span>Share Track</span>
</button>
</div>
</div>
</body></html>
